<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline block</title>

	<style>
			body {
				font-family: sans-serif;
				font-size: 20px;
				line-height: 150%;
				margin: 5rem;
			}
			div{
				border: 2px solid blue;
				padding: 3rem;
			}

			span {
				border-bottom: 2px dotted rgb(0, 144, 0);
				color: blueviolet;
				font-weight: 800;
		}
		p {
			text-align: right;
		}
	</style>


</head>
<body>	
	<div>Lorem ipsum dolor
		<span>
			sit amet consectetur adipisicing elit.
			Quam perferendis voluptates quidem suscipit, 
			fugit eligendi placeat iste amet deleniti,
			</span>
		sed eaque voluptatum, animi in dicta nostrum
		excepturi praesentium labore obcaecati!
	</div>
</body>
</html>
