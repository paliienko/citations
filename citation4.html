<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

	<style>
		body {
			 font-family: "Instrument Serif", serif;
		}

			div {
			color: rgb(0, 0, 0);
		}

				.quote{
			font-size: 2rem;
		}
				.author {
			font-size: 2rem;
			margin-top: 1rem;
			text-align: center;
		}
		
		.citation {
			margin: 2rem ;
			border: 3px solid rgb(0, 0, 0);
			padding: 1rem;
			border-radius: 3rem;
		}

		.important {
		
			border: 3px dotted black;
			padding: 1rem;
			border-radius: 3rem;

		}

		#mew {
			background-color: rgb(49, 198, 252);
		}

		#dumb {
			background-color: rgb(49, 252, 96);;
		}

	</style>


	
</head>
<body>

	<div class="citation" id="mew">

		<div class="quote">"As long as there are people, there will be user experience, and user interface designers."</div>
		<div class="author important">— Steve McGarry</div>

	</div>

	<div class="citation" id="dumb">

		<div class="quote">"There is no such thing as information overload, just bad design. If something is cluttered and/or confusing, fix your design."</div>
		<div class="author important">— Edward Tufte</div>

	</div>

</body>
</html>
